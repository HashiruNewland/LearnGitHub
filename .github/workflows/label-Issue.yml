name: label issue
on: 
  issues:
    types: 
      - reopened
      - opened
jobs:
  label_issues:
    runs-on: ubuntu-latest
    permissions: 
      issues: write
    steps:
      - name: Label isses
        uses: andymckay/labeler@1.0.2
        with:
          add-labels: "triage"
          repo-token: ${{secrets.GITHUB_TOKEN}}
      
